[project]
name = "idl-rag-backend"
version = "0.1.0"
description = "Backend for ENVI/IDL RAG panel"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.1",
  "sqlalchemy>=2.0.32",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "lancedb>=0.12.0",
  "pyarrow>=17.0.0",
  "pypdf>=4.3.1",
  "pymupdf>=1.24.10",
  "rapidocr-onnxruntime>=1.4.4",
  "cryptography>=43.0.0",
  "jieba>=0.42.1",
  "langsmith>=0.2.0",
  "earthengine-api>=1.0.0",
  "numpy>=2.0.0",
  "rasterio>=1.4.0",
  "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.1"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
